<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Try Out TKA Sosiologi</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f1ff;--card:#fff;--tx:#1e1b3a;--mu:#6b6890;--pr:#6d4aff;--pr2:#00b8d9;--ok:#16a34a;--rg:#f59e0b;--no:#e5e3f5;--bd:#dcd8f5;--bad:#e11d48}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122b;--card:#1f1c3f;--tx:#efedff;--mu:#a9a5d6;--no:#2c2958;--bd:#3a3668}}
:root[data-theme="dark"]{--bg:#14122b;--card:#1f1c3f;--tx:#efedff;--mu:#a9a5d6;--no:#2c2958;--bd:#3a3668}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,Arial,sans-serif;line-height:1.5}
.hero{background:linear-gradient(135deg,#6d4aff,#00b8d9);color:#fff;padding:22px 16px;text-align:center}
.hero h1{margin:0;font-size:1.5rem}.hero p{margin:4px 0 0;opacity:.9;font-size:.9rem}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(109,74,255,.1)}
label{display:block;font-weight:600;font-size:.85rem;margin:12px 0 4px}
input{width:100%;padding:11px 12px;border:2px solid var(--bd);border-radius:10px;font-size:1rem;background:var(--bg);color:var(--tx)}
input:focus{outline:none;border-color:var(--pr)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-weight:600;color:#fff;background:var(--pr)}
button:disabled{opacity:.4;cursor:default}
.big{width:100%;margin-top:18px;padding:13px;font-size:1.05rem;background:linear-gradient(90deg,#6d4aff,#00b8d9)}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;text-align:center;font-size:.8rem;color:var(--mu)}
.info b{display:block;font-size:1.2rem;color:var(--pr)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);padding:10px 14px;border-radius:14px;border:1px solid var(--bd);margin-bottom:12px;font-size:.85rem}
.timer{font-weight:700;font-size:1.15rem;color:var(--pr);font-variant-numeric:tabular-nums}.timer.low{color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:760px){.grid{grid-template-columns:1fr 260px}}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--bd);margin-top:8px;font-weight:500}
.opt i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--no);display:grid;place-items:center;font-style:normal;font-weight:700}
.opt.sel{border-color:var(--pr);background:rgba(109,74,255,.12)}.opt.sel i{background:var(--pr);color:#fff}
.opt.ok{border-color:var(--ok);background:rgba(22,163,74,.13)}.opt.ok i{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:rgba(225,29,72,.12)}.opt.bad i{background:var(--bad);color:#fff}
.nav{display:flex;gap:8px;margin-top:16px}.nav button{flex:1}.rg{background:var(--rg)}.rg.on{outline:3px solid var(--rg);outline-offset:2px;background:#b45309}.sec{background:var(--mu)}
.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}@media(min-width:760px){.nums{grid-template-columns:repeat(5,1fr)}}
.nums button{padding:8px 0;background:var(--no);color:var(--tx)}.nums .a{background:var(--ok);color:#fff}.nums .d{background:var(--rg);color:#fff}.nums .c{outline:3px solid var(--pr);outline-offset:1px}
.leg{display:flex;flex-wrap:wrap;gap:8px;font-size:.75rem;color:var(--mu);margin-top:10px}.leg s{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;text-decoration:none}
.q img{max-width:100%;border-radius:10px;margin:8px 0}
.score{font-size:3.6rem;font-weight:800;text-align:center;background:linear-gradient(90deg,#6d4aff,#00b8d9);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.res{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:.9rem;margin-top:12px}.res span{color:var(--mu)}
.st{display:flex;justify-content:center;gap:16px;margin-top:12px;font-size:.9rem;flex-wrap:wrap}
.rv{margin-top:12px}.pb{margin-top:10px;padding:10px 12px;border-left:4px solid var(--pr2);background:rgba(0,184,217,.1);border-radius:8px;font-size:.9rem}
.tag{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:9}.modal .card{max-width:380px}
.hid{display:none}
</style></head><body>
<div class="hero"><h1>🎓 Try Out TKA</h1><p>Sosiologi · Kelas X IPS · 30 Soal Pilihan Ganda</p></div>
<div class="wrap" id="app"></div>
<script>
const Q=[
["Gejala sosial adalah ketidaksesuaian antara unsur-unsur masyarakat atau kebudayaan yang akan membahayakan kehidupan kelompok masyarakat. Definisi tersebut disampaikan oleh…",["Pitirim A. Sorokin","Soerjono Soekanto","Karl Marx","Max Weber","Koentjaraningrat"],1,"Definisi gejala sosial sebagai ketidaksesuaian unsur masyarakat atau kebudayaan yang membahayakan kelompok dikemukakan oleh Soerjono Soekanto."],
["Perhatikan gejala sosial berikut!\n(1) Korupsi yang dilakukan pejabat negara.\n(2) Pergaulan bebas remaja di kota besar.\n(3) Naiknya harga bahan kebutuhan pokok.\n(4) Munculnya kaum sosialita menyebabkan luasnya ketimpangan sosial.\n(5) Media sosial sebagai penyebar perilaku konsumtif masyarakat.\nGejala sosial yang dikaji oleh sosiologi ditunjukkan oleh nomor…",["(1), (2) dan (3)","(1), (2) dan (4)","(1), (3) dan (5)","(2), (4) dan (5)","(3), (4) dan (5)"],3,"Sosiologi mengkaji gejala yang berkaitan dengan interaksi dan perilaku masyarakat: pergaulan bebas, ketimpangan sosial, dan perilaku konsumtif (2, 4, 5). Korupsi dan harga kebutuhan pokok lebih berkaitan dengan hukum dan ekonomi."],
["Setiap daerah memiliki rencana tata ruang publik seperti sarana olahraga, tempat bisnis, dan tempat wisata. Namun setelah selesai dibangun, sebagian masyarakat belum sadar ikut merawatnya. Upaya tepat mengatasi gejala sosial tersebut adalah…",["Melarang kunjungan wisatawan dari luar kota dan turis asing","Melarang pedagang kaki lima berjualan di sekitar tempat wisata","Melakukan penataan ruang publik dengan memberlakukan tata tertib","Menerapkan sanksi tegas bagi wisatawan lokal yang merusak tempat wisata","Menutup sebagian tempat wisata yang berpotensi dirusak wisatawan"],2,"Penataan ruang publik disertai tata tertib adalah solusi yang menyeluruh dan mendidik. Opsi lain terlalu represif atau tidak menyelesaikan akar masalah."],
["Perusahaan multinasional makanan cepat saji (fast food) semakin menjamur dan memengaruhi kehidupan sosial ekonomi anak muda. Dampak negatif gejala sosial tersebut adalah…",["Meningkatkan daya konsumsi terhadap produk olahan lokal","Menurunkan tingkat konsumsi masyarakat terhadap produk impor","Memperlambat proses westernisasi pada suatu daerah","Menghambat dominasi jaringan makanan cepat saji","Mengubah pola konsumsi masyarakat menjadi kebarat-baratan"],4,"Menjamurnya fast food mendorong westernisasi, yaitu pola konsumsi yang kebarat-baratan. Opsi lain justru dampak positif atau tidak sesuai."],
["Kemiskinan merupakan gejala sosial yang terus muncul dan tidak dikehendaki. Upaya mengatasinya adalah…",["Memberikan bantuan tunai kepada masyarakat miskin","Menyarankan masyarakat miskin mengikuti transmigrasi ke luar Jawa","Memperbaiki sistem ekonomi agar memihak masyarakat miskin","Memberikan pelatihan dan bantuan modal kerja supaya masyarakat meningkat keberhasilan dan kemandiriannya","Memberikan pendidikan dan kesehatan gratis kepada seluruh masyarakat miskin"],3,"Pelatihan dan bantuan modal kerja memberdayakan masyarakat sehingga mandiri, solusi yang berkelanjutan dibandingkan bantuan sesaat."],
["Di masa pandemi, orang sulit mencari pekerjaan baru dan banyak perusahaan mengurangi karyawan sehingga banyak pekerja di-PHK mendadak. Hal ini menunjukkan gejala sosial akibat faktor…",["Kultural","Individual","Struktural","Perubahan sosial","Ketimpangan"],2,"PHK massal akibat kondisi ekonomi dan kebijakan perusahaan berasal dari struktur sosial-ekonomi, jadi termasuk faktor struktural."],
["Banyaknya remaja yang merokok merupakan penyimpangan sosial yang diakibatkan oleh…",["Sosialisasi tidak sempurna","Subkebudayaan menyimpang","Tidak adanya norma (anomi)","Perubahan sosial","Ketimpangan sosial"],0,"Remaja merokok menandakan nilai dan norma belum tertanam utuh dari keluarga dan lingkungan, yaitu sosialisasi yang tidak sempurna."],
["Saat Hari Raya Nyepi, umat Hindu tidak menyalakan lampu atau api. Masyarakat non-Hindu ikut memadamkan lampu sebagai bentuk toleransi. Hal tersebut merupakan gejala sosial yang bersifat…",["Kumulatif","Kultural","Struktural","Positif","Negatif"],3,"Toleransi antarumat beragama membawa dampak baik bagi kerukunan, sehingga termasuk gejala sosial positif."],
["Dalam kehidupan jalanan, nilai dan norma tidak dijalankan sebagaimana fungsinya. Sering disisipkan kata kasar dalam berkomunikasi dan dianggap wajar. Perilaku menyimpang ini diakibatkan oleh…",["Mudahnya menyerap kata untuk komunikasi","Subkebudayaan yang menyimpang","Pengaruh lingkungan yang tidak sehat","Tingkat pendidikan yang tidak memadai","Sosialisasi yang tidak sempurna"],1,"Kelompok jalanan memiliki nilai dan norma sendiri yang berbeda dari masyarakat umum, yaitu subkebudayaan menyimpang."],
["Perhatikan pernyataan berikut!\n(1) KPK melakukan operasi tangkap tangan terhadap pejabat yang korupsi.\n(2) Gerobak pedagang kaki lima di trotoar ditertibkan petugas.\n(3) Polisi mensosialisasikan ke sekolah upaya mencegah pelecehan seksual.\n(4) Pelaku pencurian motor tertangkap basah dan dibawa ke pihak berwajib.\n(5) Pemuka agama menyampaikan ajaran untuk mengembangkan toleransi.\nPengendalian sosial secara koersif ditunjukkan oleh nomor…",["1, 2, dan 3","1, 2, dan 4","1, 2, dan 5","2, 4, dan 5","3, 4, dan 5"],1,"Koersif berarti dengan paksaan atau kekerasan, yaitu penangkapan, penertiban, dan penindakan pelaku (1, 2, 4). Nomor 3 dan 5 bersifat persuasif."],
["Suku Bugis memiliki tradisi mappadendang, ritual syukur atas rezeki para petani. Setiap warga bekerja sama dan mengesampingkan perbedaan sehingga tercipta kekerabatan. Fungsi nilai sosial dari ilustrasi tersebut adalah…",["Memberikan sanksi sosial bagi yang tidak berpartisipasi","Menunjukkan sikap toleransi dalam kampung adat","Mengubah struktur sosial antara adat di kampung dan perantauan","Menjaga solidaritas sosial dan nilai-nilai budaya","Menerapkan kehidupan modern dalam masyarakat"],3,"Kerja sama dalam ritual mempererat kebersamaan (solidaritas) sekaligus melestarikan nilai budaya."],
["Semua nilai yang berguna bagi manusia untuk dapat melaksanakan berbagai aktivitas sehari-hari dinamakan nilai…",["Vital","Moral","Religius","Material","Kebenaran"],0,"Nilai vital adalah nilai yang berguna agar manusia dapat beraktivitas."],
["Segala sesuatu yang berguna bagi unsur fisik manusia disebut nilai…",["Material","Vital","Kerohanian","Dominan","Mendarah daging"],0,"Nilai material berguna bagi unsur fisik atau jasmani manusia."],
["Setiap hari Rudi membantu ibunya membuat kue untuk dijual dan hasilnya digunakan membayar sekolah. Tujuan perilaku Rudi berkaitan dengan nilai sosial…",["Material","Vital","Spiritual","Logika","Estetika"],1,"Hasil kerja digunakan agar Rudi dapat bersekolah, yaitu beraktivitas. Itu termasuk nilai vital."],
["Norma yang berlaku di masyarakat pada dasarnya adalah…",["Perwujudan nilai sosial","Kesepakatan masyarakat","Kepedulian terhadap sesama","Pembatasan tindakan","Kebebasan yang mutlak"],1,"Norma lahir dari kesepakatan bersama anggota masyarakat sebagai pedoman berperilaku."],
["Perhatikan gejala-gejala sosial berikut!\n(1) Budaya ketimuran membiasakan masyarakat Indonesia tidak berpakaian terbuka.\n(2) Program Keluarga Berencana banyak diikuti warga.\n(3) Nilai gotong royong mendorong program kerja bakti lingkungan.\n(4) Pemerintah mengimbau warga Pulau Jawa bertransmigrasi.\n(5) Perubahan kurikulum mendorong perubahan pola belajar mengajar di sekolah.\nGejala sosial yang dipengaruhi faktor struktural ditunjukkan nomor…",["(1), (2), dan (3)","(1), (3), dan (5)","(2), (3), dan (4)","(2), (4), dan (5)","(3), (4), dan (5)"],3,"Faktor struktural berasal dari kebijakan atau struktur: KB (2), transmigrasi (4), dan kurikulum (5). Nomor 1 dan 3 dipengaruhi faktor kultural."],
["Rangkaian aturan bagi anggota masyarakat berisi ketentuan, perintah, kewajiban, dan larangan demi ketertiban dan keadilan, dibuat lembaga tertentu, tertulis dalam kitab undang-undang atau tidak tertulis berupa keputusan pengadilan adat, disebut…",["Norma hukum","Norma kesopanan","Norma kesusilaan","Norma agama","Norma kebiasaan"],0,"Ciri aturan tertulis dari lembaga resmi dengan sanksi tegas adalah norma hukum."],
["Perhatikan gambar berikut!\nAktivitas pada gambar menunjukkan kepatuhan terhadap norma…",["Kesopanan","Agama","Hukum","Kesusilaan","Kebiasaan"],1,"Gambar menunjukkan kegiatan ibadah di tempat ibadah, sehingga berkaitan dengan norma agama.",1],
["Norma sosial yang mempunyai sanksi paling tegas dan pasti adalah…",["Mores","Usage","Laws","Folkways","Cara"],2,"Laws (hukum) memiliki sanksi paling tegas dan pasti karena tertulis dan dijalankan aparat. (Catatan: kunci di file soal tertulis D, namun jawaban yang tepat secara teori adalah C.)"],
["Setiap hari Frendi berangkat mengenakan seragam dan sepatu hitam, menyisir rambut, dan berpamitan kepada orang tua. Perilaku Frendi sesuai dengan norma…",["Laws","Usage","Mores","Customs","Folkways"],1,"Usage (cara) adalah norma paling lemah, berkaitan dengan sopan santun dan kerapian perorangan."],
["Tindakan yang tidak sesuai dengan nilai dan norma yang berlaku di masyarakat disebut…",["Nilai sosial","Norma sosial","Sosialisasi","Keteraturan sosial","Penyimpangan sosial"],4,"Perilaku yang menyimpang dari nilai dan norma disebut penyimpangan sosial."],
["Hendri berangkat sekolah naik motor dengan helm SNI, membawa surat-surat, dan mematuhi rambu lalu lintas agar tercipta ketertiban. Ilustrasi tersebut menunjukkan Hendri melaksanakan norma…",["Budaya","Hukum","Cara","Adat istiadat","Kebiasaan"],1,"Rambu lalu lintas dan surat kendaraan diatur undang-undang, sehingga termasuk norma hukum."],
["Pak Hadi dan Bu Fani mengajarkan anaknya mematuhi tata tertib di rumah, termasuk tidak pulang terlalu malam, agar disiplin dan tidak terjerumus perilaku menyimpang. Pola sosialisasi tersebut termasuk sosialisasi…",["Langsung","Otoriter","Primer","Sekunder","Formal"],2,"Sosialisasi oleh keluarga (orang tua kepada anak) adalah sosialisasi primer."],
["Ulfa, Naili, dan Rinda bersahabat sejak kuliah. Setelah bekerja di perusahaan berbeda, mereka tetap berkumpul dan berbagi cerita. Media sosialisasi dalam uraian tersebut adalah…",["Sekolah","Keluarga","Media massa","Media elektronik","Teman sebaya"],4,"Sahabat dengan usia dan kedudukan setara termasuk agen sosialisasi teman sebaya (peer group)."],
["Heri pegawai baru di perusahaan swasta. Pada hari pertama ia memperkenalkan diri di hadapan manajer dan rekan kerja, serta meminta bimbingan. Bentuk sosialisasi yang dilakukan Heri adalah sosialisasi…",["Tidak langsung","Langsung","Sekunder","Primer","Ekualitatif"],2,"Sosialisasi di lingkungan kerja pada usia dewasa adalah sosialisasi sekunder."],
["Arman mengubah warna rambut menjadi pirang setelah melihat artis idolanya di televisi. Agen sosialisasi dari kasus tersebut adalah…",["Keluarga","Teman sepermainan","Sekolah formal","Lingkungan kerja","Media massa"],4,"Pengaruh berasal dari tayangan televisi, yaitu media massa."],
["KPAI menjelaskan pada 2018 kasus tawuran pelajar meningkat 14%. Kasus tersebut dikategorikan penyimpangan negatif karena…",["Cenderung bersifat sementara","Memberikan dampak positif bagi kelompok","Melanggar nilai dan norma dominan","Mendapat toleransi masyarakat","Menguntungkan individu"],2,"Penyimpangan negatif melanggar nilai dan norma yang dominan serta merugikan masyarakat."],
["Perilaku menyimpang sekunder ditunjukkan oleh pernyataan…",["Hendro salah menggunakan seragam ketika memasuki kelas","Sewaktu kecil Ridho memanjat pohon mangga tetangga tanpa izin","Pak Mijan menjadi buruh cuci untuk menghidupi anak-anaknya","Pencuri yang sudah beberapa kali beraksi berhasil tertangkap polisi","Tina terlambat masuk kantor karena ban bocor"],3,"Penyimpangan sekunder dilakukan berulang sehingga menjadi gaya hidup, seperti pencuri yang beberapa kali beraksi."],
["Berikut yang merupakan agen dalam sosialisasi sekunder adalah…",["Ayah, ibu, kakak, kakek, nenek","Keluarga, sekolah, masyarakat","Peer group, sekolah, dan media massa","Tetangga, keluarga, masyarakat","Keluarga, sekolah, dan media massa"],2,"Agen sosialisasi sekunder berada di luar keluarga inti: teman sebaya, sekolah, dan media massa."],

function start(){
 app.innerHTML=`<div class="card"><h2 style="margin:0 0 4px">Data Peserta</h2><div style="color:var(--mu);font-size:.9rem">Isi data berikut sebelum memulai.</div>
 <label>Nama Siswa</label><input id="n" placeholder="Nama lengkap">
 <label>Kelas</label><input id="k" placeholder="Contoh: X IPS 1">
 <label>Peserta Didik (No. Peserta / NISN)</label><input id="p" placeholder="Nomor peserta">
 <label>Asal Sekolah</label><input id="s" placeholder="Nama sekolah">
 <div class="info"><div><b>30</b>Soal</div><div><b>${MIN}</b>Menit</div><div><b>5</b>Pilihan</div></div>
 <button class="big" id="go">Mulai Try Out 🚀</button></div>`;
 $("go").onclick=()=>{U={n:$("n").value.trim(),k:$("k").value.trim(),p:$("p").value.trim(),s:$("s").value.trim()};
  if(!U.n||!U.k||!U.p||!U.s){alert("Mohon lengkapi semua data peserta.");return}
  A=Q.map(()=>-1);D=Q.map(()=>false);cur=0;left=MIN*60;fin=false;quiz();
  tm=setInterval(()=>{left--;const t=$("tm");if(t){t.textContent=fmt(left);t.classList.toggle("low",left<300)}if(left<=0)finish()},1000)};
}
function quiz(){
 const q=Q[cur];
 app.innerHTML=`<div class="top"><div><b>${esc(U.n)}</b><br><span style="color:var(--mu)">${esc(U.k)} · ${esc(U.s)}</span></div><div class="timer" id="tm">${fmt(left)}</div></div>
 <div class="grid"><div class="card q"><div style="color:var(--mu);font-size:.85rem">Soal ${cur+1} dari ${Q.length}</div>
 <p style="white-space:pre-line;font-weight:600;margin:6px 0">${esc(q[0])}</p>${q[4]?`<img src="${IMG}" alt="Gambar soal">`:""}
 ${q[1].map((o,i)=>`<button class="opt ${A[cur]===i?"sel":""}" data-i="${i}"><i>${L[i]}</i><span>${esc(o)}</span></button>`).join("")}
 <div class="nav"><button class="sec" id="pv" ${cur?"":"disabled"}>◀ Sebelumnya</button><button class="rg ${D[cur]?"on":""}" id="rg">${D[cur]?"✓ Ragu-ragu":"Ragu-ragu"}</button><button id="nx">${cur==Q.length-1?"Selesai ✔":"Selanjutnya ▶"}</button></div></div>
 <div class="card"><b>Navigasi Soal</b><div class="nums" style="margin-top:10px">${Q.map((_,i)=>`<button data-n="${i}" class="${D[i]?"d":A[i]>=0?"a":""} ${i==cur?"c":""}">${i+1}</button>`).join("")}</div>
 <div class="leg"><span><s style="background:var(--ok)"></s>Dijawab</span><span><s style="background:var(--rg)"></s>Ragu-ragu</span><span><s style="background:var(--no)"></s>Belum</span></div>
 <button class="big" style="margin-top:14px;padding:10px" id="fn">Akhiri Ujian</button></div></div>`;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{A[cur]=+b.dataset.i;quiz()});
 app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{cur=+b.dataset.n;quiz();scrollTo(0,0)});
 $("pv").onclick=()=>{cur--;quiz();scrollTo(0,0)};
 $("rg").onclick=()=>{D[cur]=!D[cur];quiz()};
 $("nx").onclick=()=>{cur==Q.length-1?confirmEnd():(cur++,quiz(),scrollTo(0,0))};
 $("fn").onclick=confirmEnd;
}
function confirmEnd(){
 const a=A.filter(x=>x>=0).length,d=D.filter(Boolean).length,m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div class="card"><h3 style="margin-top:0">Akhiri ujian?</h3><p>Terjawab: <b>${a}</b> · Belum: <b>${Q.length-a}</b> · Ragu-ragu: <b>${d}</b></p><div class="nav"><button class="sec" id="c1">Kembali</button><button id="c2">Ya, Selesai</button></div></div>`;
 document.body.appendChild(m);$("c1").onclick=()=>m.remove();$("c2").onclick=()=>{m.remove();finish()};
}
function finish(){
 if(fin)return;fin=true;clearInterval(tm);
 const ok=Q.filter((q,i)=>A[i]===q[2]).length,no=A.filter((x,i)=>x>=0&&x!==Q[i][2]).length,bl=A.filter(x=>x<0).length,sc=Math.round(ok/Q.length*1000)/10;
 app.innerHTML=`<div class="card"><div style="text-align:center;color:var(--mu)">Nilai Akhir</div><div class="score">${sc}</div>
 <div class="st"><span style="color:var(--ok)">✔ Benar ${ok}</span><span style="color:var(--bad)">✘ Salah ${no}</span><span style="color:var(--mu)">○ Kosong ${bl}</span></div>
 <div class="res"><span>Nama</span><b>${esc(U.n)}</b><span>Kelas</span><b>${esc(U.k)}</b><span>Peserta Didik</span><b>${esc(U.p)}</b><span>Asal Sekolah</span><b>${esc(U.s)}</b></div>
 <button class="big" id="rs">Ulangi Try Out</button></div>
 <h2>Pembahasan Soal</h2>`+Q.map((q,i)=>{const r=A[i]===q[2],e=A[i]<0;
 return `<div class="card rv q"><span class="tag" style="background:${r?"var(--ok)":e?"var(--mu)":"var(--bad)"}">${r?"Benar":e?"Tidak dijawab":"Salah"}</span> <b>Soal ${i+1}</b>
 <p style="white-space:pre-line;margin:8px 0">${esc(q[0])}</p>${q[4]?`<img src="${IMG}" alt="Gambar soal">`:""}
 ${q[1].map((o,j)=>`<div class="opt ${j===q[2]?"ok":j===A[i]?"bad":""}" style="margin-top:6px"><i>${L[j]}</i><span>${esc(o)}</span></div>`).join("")}
 <div class="pb"><b>Kunci: ${L[q[2]]}</b>${A[i]>=0&&!r?` · Jawabanmu: ${L[A[i]]}`:""}<br>${esc(q[3])}</div></div>`}).join("");
